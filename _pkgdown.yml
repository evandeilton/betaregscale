url: https://evandeilton.github.io/betaregscale/
template:
  bootstrap: 5
  bootswatch: cosmo
navbar:
  structure:
    left:  [intro, reference, articles]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/brs-intro.html
    github:
      icon: fab fa-github
      href: https://github.com/evandeilton/betaregscale
      aria-label: GitHub
articles:
  - title: "Getting Started"
    navbar: ~
    contents:
      - brs-intro
      - brs-advanced-workflows
      - brs-mm
      - brs-analyst-tools
reference:
  - title: "Model Fitting"
    desc: "Core functions for fitting beta interval regression models."
    contents:
      - brs
      - brsmm
      - brs_fit_fixed
      - brs_fit_var
      - brs_coef
  - title: "Simulation"
    desc: "Data simulation for Monte Carlo studies."
    contents:
      - brs_sim
  - title: "S3 Methods - Fixed Effects Models"
    desc: "Standard methods for fitted model objects of class brs."
    contents:
      - anova.brs
      - coef.brs
      - vcov.brs
      - summary.brs
      - print.brs
      - print.summary.brs
      - logLik.brs
      - AIC.brs
      - BIC.brs
      - nobs.brs
      - formula.brs
      - model.matrix.brs
      - fitted.brs
      - residuals.brs
      - predict.brs
      - confint.brs
      - plot.brs
  - title: "S3 Methods - Mixed Models"
    desc: "Standard methods for fitted model objects of class brsmm."
    contents:
      - anova.brsmm
      - coef.brsmm
      - vcov.brsmm
      - summary.brsmm
      - print.brsmm
      - print.summary.brsmm
      - logLik.brsmm
      - AIC.brsmm
      - BIC.brsmm
      - nobs.brsmm
      - fitted.brsmm
      - residuals.brsmm
      - predict.brsmm
      - ranef.brsmm
      - plot.brsmm
      - brsmm_re_study
      - print.brsmm_re_study
  - title: "Diagnostics and Summaries"
    desc: "Functions for model diagnostics and censoring summaries."
    contents:
      - brs_bootstrap
      - brs_cens
      - brs_est
      - brs_gof
      - brs_hessian
      - autoplot.brs
      - autoplot.brsmm
  - title: "Analyst Tools"
    desc: "Post-estimation tables, effects, score probabilities, and validation."
    contents:
      - brs_table
      - brs_marginaleffects
      - brs_predict_scoreprob
      - brs_cv
  - title: "Data Preparation"
    desc: "Functions for preparing response data and beta reparameterization."
    contents:
      - brs_prep
      - brs_check
      - brs_repar
