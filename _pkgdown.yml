url: https://evandeilton.github.io/betaregscale/

template:
  bootstrap: 5
  bootswatch: cosmo

navbar:
  structure:
    left:  [intro, reference, articles]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/betaregscale.html
    github:
      icon: fab fa-github
      href: https://github.com/evandeilton/betaregscale
      aria-label: GitHub

articles:
  - title: "Getting Started"
    navbar: ~
    contents:
      - betaregscale

reference:
  - title: "Model Fitting"
    desc: "Core functions for fitting beta interval regression models."
    contents:
      - brs
      - brs_fit_fixed
      - brs_fit_var
      - brs_coef

  - title: "Simulation"
    desc: "Data simulation for Monte Carlo studies."
    contents:
      - brs_sim

  - title: "S3 Methods"
    desc: "Standard methods for fitted model objects of class brs."
    contents:
      - coef.brs
      - vcov.brs
      - summary.brs
      - print.brs
      - print.summary.brs
      - logLik.brs
      - AIC.brs
      - BIC.brs
      - nobs.brs
      - formula.brs
      - model.matrix.brs
      - fitted.brs
      - residuals.brs
      - predict.brs
      - confint.brs
      - plot.brs

  - title: "Diagnostics and Summaries"
    desc: "Functions for model diagnostics and censoring summaries."
    contents:
      - brs_cens
      - brs_est
      - brs_gof
      - brs_hessian

  - title: "Data Preparation"
    desc: "Functions for preparing response data and beta reparameterization."
    contents:
      - brs_prep
      - brs_check
      - brs_repar
